<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Subscriber</title>
    
    <script type="text/javascript" th:src="@{/js/plugin/jquery/jquery.js}"></script>
<script type="text/javascript"
	th:src="@{/js/plugin/datatable/datatables.min.js}"></script>
<script type="text/javascript" th:src="@{/js/plugin/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/css/bootstrap/js/bootstrap.min.js}"></script>
	
	<script type="text/javascript"
	th:src="@{/js/applicationjs/javascript.js}"></script>
	

<script type="text/javascript"
	th:src="@{/js/plugin/intITelInput/js/intlTelInput.js}"></script>

 <script type="text/javascript"
	th:src="@{/js/applicationjs/setupcertificate.js}"></script> 

	


<link rel="stylesheet" th:href="@{/css/datatable/datatables.min.css}" />
<link rel="stylesheet" th:href="@{/css/bootstrap/css/bootstrap.min.css}" />
<link rel="stylesheet"
	th:href="@{/css/font-awesome/css/font-awesome.min.css}" />
<link rel="stylesheet" th:href="@{/css/style.css}" />
<link rel="stylesheet"
	th:href="@{/js/plugin/intITelInput/css/intlTelInput.css}" />
</head> 
<body>
<div th:replace="fragments/fragments :: header"></div>
<div th:replace="fragments/fragments :: main_menu"></div>
<div id="listmanagecertificatepage">
  <div class="wrapper">
  
    <div class="container-fluid">
        <div class="page-title-section">
            <div class="row">
                <div class="col-md-6 col-sm-6">
                    <h3>Manage Certificates</h3>
                </div>
                <div class="col-md-6 col-sm-6">
                    <div class="title-action">

                    </div>
                </div>
            </div>
        </div>
        <div class="search-section">
            <div class="row">
                <div class="col-md-7 col-sm-12">
                    <div class="filter-box filter-general" id="filterBox">
                        <label>Filter By</label>
                        <a href="javascript:void(0)" id="active" class="label label-active">Active</a>
                        <a href="javascript:void(0)" id="pending" class="label label-active">Pending</a>
                        <a href="javascript:void(0)" id="expires" class="label label-active">Expired</a>
                        <a href="javascript:void(0)" id="inprogress" class="label label-active">In-Progress</a>
                        <a href="javascript:void(0)" id="rejected" class="label label-active">Rejected</a>
                        <a href="javascript:void(0)" id="revoked" class="label label-active">Revoked</a>
                    </div>
              	</div>
				<div class="col-md-5 col-sm-12 search-general">
                   <div class="row">
                   		<div class="col-md-7">
                   			<label>Search By</label>
                   			<input type="text" class="form-control" placeholder="Application ID" id="searchcname" style="margin-right: 10px;" />
        					<button type="button" class="btn-search" id="btnSearch"><i class="fa fa-search"></i></button>
                   		</div>
                   		<div class="col-md-5">
                   			<div class="advancesearch">
        						<a href="javascript:void(0)" class="btn btn-default btn-advSearch ml-auto" id="btnAdvanceSearch">Advance Search</a>
                        		<div class="advancesearch-box" id="advanceSearchBox" style="display:none;">
                            		<div class="advancesearch-form">
                                		<h3>Advance Search</h3>
                                		<div class="row form-group">
                                    		<div class="col-md-2 form-label">Search By</div>
                                    		<div class="col-md-10">
                                        		<div class="checkbox-inline">
                                            		<input type="radio" name="searchBy" id="applicationID" th:value="${applicationID}"/><label th:for="applicationID" style="cursor: pointer;">Application ID</label>
                                            		<!--<input type="radio" name="searchBy" id="orderID" th:value="${orderID}"/><label th:for="orderID" style="cursor: pointer;">Order ID</label>-->
                                            		<input type="radio" name="searchBy" id="commonName" th:value="${commonName}"/><label th:for="commonName" style="cursor: pointer;">Common Name</label>
                                            		<input type="text" class="form-control common-control" id="serachany"/>
                                        		</div>
                                    		</div>
                                		</div>
                                		<div class="row form-group">
                                    		<div class="col-md-2">Status</div>
                                    		<div class="col-md-10">
                                        		<span class="filter-box" id="advanceFilterBox">
                                            		<a href="javascript:void(0)" id="activeAS" class="label label-active">Active</a>
                                            		<a href="javascript:void(0)" id="pendingAS" class="label label-active">Pending</a>
                                            		<a href="javascript:void(0)" id="expiresAS" class="label label-active">Expired</a>
                                            		<a href="javascript:void(0)" id="inprogressAS" class="label label-active">In-Progress</a>
                                            		<a href="javascript:void(0)" id="rejectedAS" class="label label-active">Rejected</a>
                                            		<a href="javascript:void(0)" id="revokedAS" class="label label-active">Revoked</a>
                                            		<!--<a href="javascript:void(0)" id="suspendedAS" class="label label-active">Suspended</a>-->
                                        		</span>
                                    		</div>
                                		</div>
                                		<div class="row form-group">
                                    		<div class="col-md-2 form-label" style="padding-right:0;white-space:nowrap;">Include Date Range <input type="checkbox" name="generalDatePick" id="generalDatePick"></div>
                                    		<div class="col-md-10">
                                        		<div class="form-inline">
                                            		<label>From</label>
                                            		<div class="date-control">
                                                		<input type="date" class="form-control" id="fromDate"  />
                                                		<input type="hidden" name="date" id="setdate" />
                                            		</div>
                                            		<label>To</label>
                                            		<div class="date-control">
                                                		<input type="date" class="form-control" id="toDate"  />
                                            		</div>
                                        		</div>
                                    		</div>
                                		</div>
                                		<div class="row form-group button-action">
                                    		<div class="col-md-10 offset-md-2">
                                        		<input type="button" class="btn btn-primary" value="Search" id="searchData" th:onclick="searchorders('3')"/>
                                        		<input type="reset" class="btn btn-default" value="Reset" id="resetData" th:onclick="resetadvancedserachfields()"/>
                                        		<input type="button" class="btn btn-default" value="Cancel" th:onclick="closeadvancedserach()"/>
                                    		</div>
                                		</div>
                            		</div>
                        		</div>
                    		</div>
                   		</div>
                   </div>
                </div>
                <div class="clearfix"></div>
          </div>
        </div>
    </div>
</div>
<div class="container-fluid content content-page">
    <div id="processselection" class="processselection" style="display:none;"></div>
    <div class="manage-section table-responsive">
        <form id="submitforms" method="post">
           
           
            
            <table id="manageCertificates" class="table table-striped table-manage">
                <thead>
                    <tr>
                    <!--     <th width="5%">Sl.No</th>
                        <th width="20%">Application ID / Date</th>
                        <th width="20%">Common Name / Validity</th>
                        <th width="25%">Certificate</th>
                        <th width="10%">Status</th>
                        <th width="10%">Expires</th>
                        <th width="10%">Action</th> -->
                    </tr>
                </thead>
              
            </table>
            
            
        </form>
      
    </div>
</div>
</div>
    

  <!--     <div th:replace="fragments/setupmanagecertificate :: setup_managecertificate"></div> -->
          
</body>
<div th:replace="fragments/fragments :: footer"></div>
</html>
