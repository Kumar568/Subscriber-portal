<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
<meta charset="UTF-8">
<title>Subscriber | Generate Password</title>
<script type="text/javascript" th:src="@{/js/plugin/jquery/jquery.js}"></script>
<script type="text/javascript"
	th:src="@{/css/bootstrap/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/js/applicationjs/generatepassword.js}"></script>
<link rel="stylesheet" th:href="@{/css/style.css}" />
<link rel="stylesheet" th:href="@{/css/bootstrap/css/bootstrap.min.css}" />
<link rel="stylesheet"
	th:href="@{/css/font-awesome/css/font-awesome.min.css}" />

</head>
    <body>
        <div class="wrapper">
            <div class="account-section">
                <div class="container">						
                    <div class="content">                        
                        <div class="row">
                            <div class="col-md-10 offset-md-1">                                    
                                <div class="row">
                                    <div class="col-md-6 offset-md-3">
                                        <div class="text-center">
                                            <a class="logo" th:href="@{'#'}">
                                                <img id="profile-img3"
											th:src="@{/images/emudhra_logo.png}" alt="" />						
                                            </a>								
                                        </div>
                                        <div class="account-box">
                                            <div id="processselection" class="processselection"></div>
                                            <div id="genp">
                                                <div class="form-group">
                                                    <div class="form-label">Email ID</div>
                                                    <input class="form-control" name="newgenemailid" id="newgenemailid" type="text" th:value="${customers.emailId}" disabled >
                                                </div>
                                                <div class="form-group">
                                                    <div class="form-label">Login ID</div>
                                                    <input class="form-control" name="newgenusername" id="newgenusername" type="text" th:value="${customers.userName}" disabled>
                                                </div>
                                                <div class="form-group">
                                                    <div class="form-label">Password</div>
                                                    <input class="form-control" name="password" id="genpassword" type="password" tabindex="3" maxlength="25" >
                                                    <i class="fa fa-eye showPwd" id="generateshowpassword" style="display:none;"></i>
                                                    <i class="fa fa-eye-slash" id="generatehidepassword"></i>
                                                    <div class="tooltip-status" id="passwordTooltip" style="display:none;">
                                                        <ul>
                                                            <li id="rule1"><i class="fa fa-circle-o"></i> Be atleast 9 characters</li>
                                                            <li id="rule2"><i class="fa fa-circle-o"></i> Include a lowercase letter</li>
                                                            <li id="rule3"><i class="fa fa-circle-o"></i> Include an uppercase letter</li>
                                                            <li id="rule4"><i class="fa fa-circle-o"></i> Include a number</li>
                                                            <li id="rule5"><i class="fa fa-circle-o"></i> Not start or end with a space</li>
                                                        </ul>
                                                    </div>     
                                                </div>      
                                                <div class="form-group">
                                                    <div class="form-label">Confirm Password</div>
                                                    <input class="form-control" name="gencpassword" id="gencpassword" type="password" >
                                                    <div class="tooltip-status" id="confirmpasswordTooltip" style="display:none;">
                                                        <ul>
                                                            <li id="rule1"><i class="fa fa-circle-o"></i> Password and Confirm Password should be same</li>
                                                        </ul>
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <div class="form-label">Captcha</div>
                                                    <div class="captcha-box">
                                                        <input class="form-control" type="text"  maxlength="6" id="generatepasscaptcha" name="generatepasscaptcha" tabindex="5">
                                                        <img
															class="captcha-image"
													th:src="'data:image/png;base64,'+
															${captchaNumber.image}"
														
															id="generatepasscaptchaimg">
															 <img
															src="../images/refresh-icon.png"
															onclick="refreshCaptcha()" class="cpointer" alt="Refresh" />
                                                    </div>
                                                </div> 
                                                <div class="form-group button-action">
                                                    <span id="processingimg_generate">
                                                        <input type="button" id="genertaepassword" class="btn btn-primary" tabindex="6" value="Proceed" disabled />
                                                    </span>
                                                    <input type="button"  class="btn btn-default" value="cancel" tabindex="7" id="cancel_idv"/></div>
                                            </div>
                                            
                                              <div id="generatepasswordSuccessblock" class="generatepasswordSuccessblock" style="display: none;">
                                                <h1 class="title" id="genertaepasssuccessmsg"></h1>
                                                <div class="row form-group button-action">
                                                </div>
                                                    <div class="col-sm-12">
                                                        Continue to <a href="">Sign In</a>
                                                    </div>
                                                </div>
                                            </div>  
                                        </div>
                                     
                                    </div>
                                </div>				
                            </div>
                        </div>				
                    </div>
                </div>
            </div>	
           
      
      
        
     <div th:replace="fragments/message :: messagebox"></div>
        
    </body>
</html>
