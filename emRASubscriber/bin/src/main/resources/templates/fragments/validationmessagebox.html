<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>MessageBox | Admin</title>
<link rel="stylesheet" th:href="@{/css/style.css}" />
<!-- <link rel="stylesheet" th:href="@{/css/navigations.css}" /> -->
<script type="text/javascript" th:src="@{/js/plugin/jquery/jquery.js}"></script>

<link rel="stylesheet" th:href="@{/css/bootstrap/css/bootstrap.min.css}" />
<link rel="stylesheet" th:href="@{/css/font-awesome/css/font-awesome.min.css}" />
<link type="application/javascript"
	th:href="@{/css/bootstrap/js/bootstrap.min.js}" />
</head>
<body>

<div th:fragment="messagebox">
	<div id="customfieldvalidationModal" class="modal" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-body">
                <div class="image-container">
                   
                </div>
                <div class="text-container">
                    <i class="fa fa-time-circle"></i>
                    <ul id="error-messages">
                        <!-- Error messages will be added here -->
                    </ul>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal">Ok</button>
            </div>
        </div>
    </div>
</div>

</div>



</body>
</html>
